[project]
name = "ai-data-analyser"
version = "0.1.0"
description = "Local-first AI data analysis platform: deterministic tools, LLM tool-calling, verified answers"
requires-python = ">=3.12"

# Every dependency here needs a concrete reason. Added per-milestone, not up front.
dependencies = [
    # M1 — talk to Ollama, load config, own the Postgres schema
    "httpx>=0.27",             # HTTP client for the Ollama API (sync + async, one library)
    "pydantic>=2.7",           # schema definition + validation, used everywhere later
    "pydantic-settings>=2.3",  # typed config from .env, no scattered os.getenv calls
    "sqlalchemy>=2.0",         # Postgres access; needed for FOR UPDATE SKIP LOCKED in M4
    "alembic>=1.13",           # schema migrations, versioned from the first table
    "psycopg[binary]>=3.1",    # Postgres driver (v3; binary wheel avoids a C toolchain on Windows)
    "duckdb>=1.0",             # M1: bench grades generated SQL by EXECUTING it, not by
    # regex. M2 onward: the analytical query engine itself.
    # M2 — SQL safety
    "sqlglot>=30.17",          # parse SQL to an AST so the executor can ALLOWLIST
    # (root node must be SELECT/WITH) instead of blocklisting
    # keywords, which comments and nesting defeat.
    # M4 — the HTTP surface. No task queue library appears here on purpose: the job
    # queue is Postgres (SELECT ... FOR UPDATE SKIP LOCKED), so Celery and Redis would
    # add two runtime services to solve a problem the database already solves. See D-022.
    "fastapi>=0.115",          # typed request/response models reuse the pydantic already
    # present, and OpenAPI is generated rather than written.
    "uvicorn[standard]>=0.30",  # ASGI server. [standard] adds httptools + uvloop-equivalent
    # and, on Windows, the watchfiles reloader.
    "python-multipart>=0.0.9",  # multipart/form-data parsing; FastAPI refuses to start a
    # route with UploadFile without it.
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",               # linter + formatter in one tool

    # M3 - the evaluation set. Questions carry multi-line reference SQL, which JSON
    # can only hold as one escaped single line: unreadable to write, undiffable in
    # review. The question files are hand-authored and read far more often than they
    # are parsed, so the format is chosen for the human.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; holding generated code to hand-written style rules means
# editing every migration after generating it, which invites editing the wrong thing.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # Tests needing live infrastructure (Postgres, Ollama). Skip with -m "not integration".
    "integration: requires running external services",
]
